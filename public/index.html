<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      링크 미리보기(OG). 크롤러는 JS를 돌리지 않으므로 앱이 아니라 이 템플릿에 직접 넣는다.
      og:image는 절대 주소여야 해서 GitHub Pages 주소(deploy-pages.yml)를 그대로 적었다.
      이미지는 public/og-image.png (1200×630).
    -->
    <meta name="description" content="한국 생활 속 실제 상황을 AI로 말하면서 배우는 한국어 스피킹, 또박이" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ddobak" />
    <meta property="og:title" content="또박이 — 말하면서 배우는 한국어 스피킹" />
    <meta property="og:description" content="한국 생활 속 실제 상황을 AI로 말하면서 배우는 한국어 스피킹, 또박이" />
    <meta property="og:url" content="https://abmlabdesign-ctrl.github.io/ddobagi/" />
    <meta property="og:image" content="https://abmlabdesign-ctrl.github.io/ddobagi/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="또박이 — 말하면서 배우는 한국어 스피킹" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="또박이 — 말하면서 배우는 한국어 스피킹" />
    <meta name="twitter:description" content="한국 생활 속 실제 상황을 AI로 말하면서 배우는 한국어 스피킹, 또박이" />
    <meta name="twitter:image" content="https://abmlabdesign-ctrl.github.io/ddobagi/og-image.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
