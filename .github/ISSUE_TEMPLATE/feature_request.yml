name: 기능 요청
description: 새로운 기능이나 개선 아이디어를 제안해주세요
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 지금 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 관련 이슈, 링크, 스크린샷 등
    validations:
      required: false
