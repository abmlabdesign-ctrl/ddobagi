name: 버그 리포트
description: 동작하지 않는 부분을 알려주세요
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 있었나요?
      description: 어떤 문제가 발생했는지 한두 문장으로 적어주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: OS, 브라우저/런타임 버전, 커밋 해시 등
      placeholder: |
        - OS:
        - 버전:
        - 커밋:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 에러 메시지나 화면을 붙여주세요. 토큰·비밀번호 등 민감한 값은 지워주세요.
      render: shell
    validations:
      required: false
