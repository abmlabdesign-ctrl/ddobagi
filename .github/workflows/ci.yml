name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 아직 스택이 정해지지 않은 저장소라, 어떤 매니페스트가 있는지 보고
  # 해당하는 잡만 실행한다. 코드가 들어오면 자동으로 켜진다.
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  node:
    name: Node
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          # 락파일이 생기기 전에는 npm ci를 쓸 수 없으므로 install로 대체한다.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi
      - name: Lint
        run: |
          if pip show ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff 미설치 - 린트 건너뜀"
          fi
      - name: Test
        run: |
          if pip show pytest >/dev/null 2>&1; then
            pytest
          else
            echo "pytest 미설치 - 테스트 건너뜀"
          fi
