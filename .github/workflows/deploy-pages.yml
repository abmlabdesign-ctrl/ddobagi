name: Deploy web to Pages

# 웹 빌드를 GitHub Pages로 올린다. 프로젝트 사이트라 주소가
# https://<owner>.github.io/ddobagi/ 처럼 서브경로가 되므로
# app.json의 experiments.baseUrl이 /ddobagi로 맞춰져 있어야 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 되므로 앞선 실행을 취소하지 않고 순서대로 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Export web
        run: npm run export:web

      # Pages에는 SPA 폴백이 없다. 테스터가 /ddobagi/review/mission 같은 주소를
      # 직접 열거나 새로고침하면 404가 뜨므로, 404.html에 같은 앱을 얹어
      # expo-router가 경로를 이어받게 한다.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Pages가 아직 꺼져 있으면 여기서 Actions 소스로 켠다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
